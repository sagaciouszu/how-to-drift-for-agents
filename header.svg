  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03060a"/>
      <stop offset="50%" stop-color="#07111a"/>
      <stop offset="100%" stop-color="#12061a"/>
    </linearGradient>
    <radialGradient id="rift" cx="0.28" cy="0.62" r="0.45">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#7e22ce" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
